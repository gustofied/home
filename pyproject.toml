[project]
name = "backend"
version = "0.1.0"
description = "DataBank facility scraping, data quality and capacity analysis"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi[standard]>=0.141.1",
    "httpx2>=2.13.0",
    "pandas>=3.0.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
backend = "backend.cli:app"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "backend.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
